
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Food Night</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
    <link rel="stylesheet" href="../css/admin-categories.css">
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="max-w-6xl mx-auto p-4 md:p-8">

        <!-- Tiêu đề -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">
                    Quản lý danh mục
                </h1>
                <p class="text-gray-500 mt-1">
                    Thêm, sửa, ẩn hiện và sắp xếp danh mục món ăn
                </p>
            </div>

            <button
                id="add-category-button"
                class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-3 rounded-lg"
            >
                <i class="fa-solid fa-plus mr-2"></i>
                Thêm danh mục
            </button>
        </div>

        <!-- Thông báo -->
        <div id="message" class="hidden mb-4 p-3 rounded-lg"></div>

        <!-- Danh sách -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center">
                <div>
                    <h2 class="font-semibold text-gray-800">
                        Danh sách danh mục
                    </h2>
                    <p class="text-sm text-gray-500 mt-1">
                        Sử dụng nút mũi tên để thay đổi thứ tự hiển thị
                    </p>
                </div>

                <button
                    id="reload-button"
                    class="text-orange-600 hover:text-orange-700"
                    title="Tải lại"
                >
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="px-4 py-3">Thứ tự</th>
                            <th class="px-4 py-3">Tên danh mục</th>
                            <th class="px-4 py-3">Mô tả</th>
                            <th class="px-4 py-3">Trạng thái</th>
                            <th class="px-4 py-3 text-center">Sắp xếp</th>
                            <th class="px-4 py-3 text-center">Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="category-table-body">
                        <tr>
                            <td colspan="6" class="text-center py-8 text-gray-500">
                                Đang tải danh mục...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Popup thêm / sửa danh mục -->
    <section
        id="category-modal"
        class="hidden fixed inset-0 z-50 bg-black/50 p-4 items-center justify-center"
    >
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6">
            <div class="flex justify-between items-center mb-5">
                <h2 id="modal-title" class="text-xl font-bold text-gray-800">
                    Thêm danh mục
                </h2>

                <button
                    id="close-modal-button"
                    type="button"
                    class="text-gray-500 hover:text-red-500 text-xl"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="category-form">
                <input type="hidden" id="category-id">

                <div class="mb-4">
                    <label for="category-name" class="block text-sm font-medium mb-2">
                        Tên danh mục *
                    </label>

                    <input
                        id="category-name"
                        type="text"
                        maxlength="100"
                        required
                        placeholder="Ví dụ: Món khai vị"
                        class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-orange-400"
                    >
                </div>

                <div class="mb-4">
                    <label for="category-description" class="block text-sm font-medium mb-2">
                        Mô tả
                    </label>

                    <textarea
                        id="category-description"
                        rows="3"
                        placeholder="Nhập mô tả danh mục..."
                        class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-orange-400"
                    ></textarea>
                </div>

                <div class="flex justify-end gap-3 border-t pt-5 mt-5">
                    <button
                        id="cancel-modal-button"
                        type="button"
                        class="px-5 py-2 border rounded-lg hover:bg-gray-50"
                    >
                        Hủy
                    </button>

                    <button
                        type="submit"
                        class="px-5 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-lg"
                    >
                        <i class="fa-solid fa-floppy-disk mr-1"></i>
                        Lưu danh mục
                    </button>
                </div>
            </form>
        </div>
    </section>

    <!-- Thứ tự script -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/pages/admin-categories.js"></script>
</body>
</html>
