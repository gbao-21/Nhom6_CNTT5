<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn của tôi & Theo dõi đơn | Bếp Việt</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/my-orders.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .status-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }
    .status-tab {
      border: 1px solid var(--color-border);
      background: #fff;
      color: var(--color-text);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .status-tab:hover {
      border-color: #ea580c;
      color: #ea580c;
    }
    .status-tab.active {
      background: #ea580c;
      border-color: #ea580c;
      color: #fff;
    }
    .order-card-item {
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      background: #fff;
      transition: border-color 0.15s;
    }
    .order-card-item.selected-order {
      border: 2px solid #ea580c;
      background: #fff7ed;
    }
    .badge-status {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-PENDING { background: #fef3c7; color: #b45309; }
    .badge-CONFIRMED { background: #dbeafe; color: #1d4ed8; }
    .badge-PREPARING { background: #ede9fe; color: #6d28d9; }
    .badge-DELIVERING { background: #ffedd5; color: #c2410c; }
    .badge-COMPLETED { background: #dcfce7; color: #15803d; }
    .badge-CANCELLED { background: #fee2e2; color: #b91c1c; }

    .progress-steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    @media (max-width: 680px) {
      .progress-steps { grid-template-columns: repeat(2, 1fr); }
    }
    .progress-step {
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      background: #f9fafb;
      color: #9ca3af;
    }
    .progress-step.done {
      border-color: #86efac;
      background: #f0fdf4;
      color: #15803d;
      font-weight: 600;
    }
    .progress-step.current {
      border: 2px solid #ea580c;
      background: #fff7ed;
      color: #c2410c;
      font-weight: 700;
    }
    .btn-danger {
      background: #dc2626;
      color: #fff;
      border: none;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container">
    <!-- 1. DANH SÁCH ĐƠN CỦA TÔI THEO TAB TRẠNG THÁI -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
        <div>
          <h2 style="margin:0;">📦 Đơn hàng của tôi</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;">Lọc đơn theo trạng thái, bấm vào đơn để theo dõi tiến trình trực tiếp</p>
        </div>
        <button id="btn-refresh-orders" type="button" class="btn btn-small">
          <i class="fa-solid fa-rotate" aria-hidden="true"></i> Làm mới danh sách
        </button>
      </div>

      <!-- Các Tab trạng thái -->
      <div id="order-status-tabs" class="status-tabs">
        <button type="button" class="status-tab active" data-status="ALL">Tất cả</button>
        <button type="button" class="status-tab" data-status="PENDING">Chờ xác nhận</button>
        <button type="button" class="status-tab" data-status="CONFIRMED">Đã xác nhận</button>
        <button type="button" class="status-tab" data-status="PREPARING">Đang chuẩn bị</button>
        <button type="button" class="status-tab" data-status="DELIVERING">Đang giao</button>
        <button type="button" class="status-tab" data-status="COMPLETED">Hoàn thành</button>
        <button type="button" class="status-tab" data-status="CANCELLED">Đã huỷ</button>
      </div>

      <div id="reorder-status" class="reorder-status" role="status" aria-live="polite" hidden></div>
      <div id="my-orders-tab-list">
        <p class="muted">Đang tải danh sách đơn hàng...</p>
      </div>
    </div>

    <!-- 2. KHUNG THEO DÕI MỘT ĐƠN HÀNG (THANH TIẾN TRÌNH TỰ CẬP NHẬT MỖI 15 GIÂY + NÚT HUỶ KHI CÒN ĐƯỢC PHÉP) -->
    <div id="tracking-card" class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 style="margin:0;">🔎 Theo dõi tiến trình đơn hàng</h2>
          <p id="auto-refresh-indicator" class="muted" style="margin:4px 0 0;font-size:12px;">
            <i class="fa-regular fa-clock" aria-hidden="true"></i> Tự động cập nhật trạng thái mỗi 15 giây (còn <span id="poll-countdown">15</span>s)
          </p>
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div>
            <label for="order-id-input" style="margin-top:0;font-size:12px;">ID đơn hàng</label>
            <input id="order-id-input" type="number" min="1" placeholder="VD: 1" style="width:120px;">
          </div>
          <button id="btn-load-order" class="btn btn-primary">Theo dõi đơn</button>
        </div>
      </div>

      <!-- Chi tiết tiến trình của đơn đang chọn -->
      <div id="order-info" hidden style="margin-top:16px;border-top:1px solid var(--color-border);padding-top:16px;">
        <div id="order-status-info"></div>

        <!-- Thanh tiến trình 5 bước -->
        <div id="tracking-progress-bar" class="progress-steps"></div>

        <!-- Các nút thao tác trên đơn đang theo dõi: Huỷ đơn (khi còn PENDING) & Đặt lại -->
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
          <button id="cancel-order-button" type="button" class="btn btn-danger" hidden>
            <i class="fa-solid fa-ban" aria-hidden="true"></i>
            Huỷ đơn hàng
          </button>
          <button id="reorder-button" type="button" class="btn btn-primary" hidden>
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            Đặt lại đơn này
          </button>
        </div>

        <!-- Danh sách món & lịch sử trạng thái của đơn đang theo dõi -->
        <div id="tracking-order-details" style="margin-top:16px;"></div>
      </div>
    </div>

    <!-- 3. ĐÁNH GIÁ ĐƠN HÀNG ĐÃ HOÀN THÀNH -->
    <div id="reviews-section" hidden>
      <div class="card">
        <h3 style="margin-top:0;">⭐ Đánh giá các món trong đơn</h3>
        <div id="dish-reviews-list"></div>
      </div>
    </div>

    <!-- Giữ tương thích vùng đơn đã hoàn thành -->
    <div id="completed-orders-list" hidden></div>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/my-orders.js"></script>
</body>
</html>
