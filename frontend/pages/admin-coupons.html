<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý mã giảm giá | KS25</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container layout-2col">
    <!-- Form thêm / sửa -->
    <section class="card">
      <h2 id="form-title">Thêm mã giảm giá</h2>
      <form id="coupon-form">
        <label for="code">Mã *</label>
        <input id="code" name="code" type="text" required maxlength="50" placeholder="VD: SALE10">

        <label for="description">Mô tả</label>
        <input id="description" name="description" type="text" placeholder="Không bắt buộc">

        <label for="discount_type">Loại giảm *</label>
        <select id="discount_type" name="discount_type" required style="width:100%;padding:8px 10px;border:1px solid var(--color-border);border-radius:var(--radius);font:inherit;">
          <option value="PERCENT">Phần trăm (%)</option>
          <option value="FIXED">Số tiền cố định (VNĐ)</option>
        </select>

        <label for="discount_value">Giá trị giảm *</label>
        <input id="discount_value" name="discount_value" type="number" required min="0" step="1" placeholder="VD: 10 (%) hoặc 50000 (VNĐ)">

        <label for="min_order_amount">Đơn tối thiểu (VNĐ)</label>
        <input id="min_order_amount" name="min_order_amount" type="number" min="0" step="1000" placeholder="0">

        <label for="max_uses">Số lượt dùng tối đa</label>
        <input id="max_uses" name="max_uses" type="number" min="1" step="1" placeholder="Không giới hạn nếu để trống">

        <label for="valid_from">Hiệu lực từ</label>
        <input id="valid_from" name="valid_from" type="datetime-local">

        <label for="valid_to">Hiệu lực đến</label>
        <input id="valid_to" name="valid_to" type="datetime-local">

        <div class="form-actions">
          <button id="btn-submit" type="submit" class="btn btn-primary">Thêm</button>
          <button id="btn-cancel" type="button" class="btn" hidden>Huỷ</button>
        </div>
      </form>
    </section>

    <!-- Danh sách -->
    <section class="card">
      <div class="list-header">
        <h2>Danh sách mã giảm giá</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mã</th>
              <th>Loại</th>
              <th>Giá trị</th>
              <th>Đơn tối thiểu</th>
              <th>Lượt dùng</th>
              <th>Hiệu lực</th>
              <th>Trạng thái</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="coupon-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/admin-coupons.js"></script>
</body>
</html>
