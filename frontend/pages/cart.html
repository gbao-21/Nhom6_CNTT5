<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng | Bếp Việt</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 antialiased">
  <header class="sticky top-0 z-40 border-b bg-white shadow-sm">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4">
      <a href="menu.html" class="flex items-center gap-2 text-xl font-extrabold text-orange-600">
        <i class="fa-solid fa-bowl-food" aria-hidden="true"></i>
        <span>Bếp Việt</span>
      </a>
      <a href="menu.html" class="text-sm font-semibold text-gray-600 transition hover:text-orange-600">
        <i class="fa-solid fa-arrow-left mr-1" aria-hidden="true"></i>
        Tiếp tục mua món
      </a>
    </div>
  </header>

  <div id="cart-message" class="fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-lg" role="status" aria-live="polite"></div>

  <main class="mx-auto max-w-7xl px-4 py-8 md:py-12">
    <div class="mb-7 flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase tracking-[.16em] text-orange-600">BẾP VIỆT</p>
        <h1 class="text-2xl font-extrabold text-gray-900 md:text-3xl">Giỏ hàng của bạn</h1>
        <p id="cart-item-count" class="mt-1 text-sm text-gray-500">Đang tải giỏ hàng...</p>
      </div>
      <button id="clear-cart-button" type="button" class="hidden rounded-lg px-3 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-50">
        <i class="fa-regular fa-trash-can mr-1" aria-hidden="true"></i>
        Xóa giỏ hàng
      </button>
    </div>

    <div class="grid items-start gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
      <section id="cart-items" aria-live="polite" class="min-w-0">
        <div class="rounded-2xl border border-gray-100 bg-white p-8 text-center text-sm text-gray-500 shadow-sm">
          Đang tải các món trong giỏ...
        </div>
      </section>

      <aside id="cart-summary" class="hidden rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
        <h2 class="mb-5 text-lg font-bold text-gray-900">Tóm tắt đơn hàng</h2>
        <dl class="space-y-3 text-sm">
          <div class="flex justify-between gap-4">
            <dt class="text-gray-500">Tạm tính</dt>
            <dd id="cart-subtotal" class="font-semibold text-gray-800"></dd>
          </div>
          <div class="flex justify-between gap-4">
            <dt class="text-gray-500">Phí giao hàng</dt>
            <dd id="cart-shipping" class="text-right font-medium text-gray-700"></dd>
          </div>
          <div id="cart-discount-row" class="hidden flex justify-between gap-4">
            <dt class="text-gray-500">Giảm giá</dt>
            <dd id="cart-discount" class="font-semibold text-green-700"></dd>
          </div>
        </dl>
        <div class="my-5 border-t border-dashed border-gray-200"></div>
        <div class="flex items-center justify-between gap-4">
          <strong class="text-base text-gray-900">Tổng cộng</strong>
          <strong id="cart-total" class="text-xl font-extrabold text-orange-600"></strong>
        </div>
        <p class="mt-4 rounded-xl bg-orange-50 p-3 text-xs leading-5 text-orange-800">
          Phí giao hàng có thể thay đổi theo khu vực nhận hàng.
        </p>
        <a href="menu.html" class="mt-5 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-orange-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-orange-700">
          <i class="fa-solid fa-utensils" aria-hidden="true"></i>
          Tiếp tục mua món
        </a>
      </aside>
    </div>
  </main>

  <footer class="border-t bg-white py-5 text-center text-sm text-gray-500">
    © 2026 Bếp Việt · Món ngon giao tận nơi
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/pages/cart.js"></script>
</body>
</html>
