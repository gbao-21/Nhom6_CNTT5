<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Đơn - Bếp Việt</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-orange-600 flex items-center gap-2">
                <i class="fa-solid fa-utensils"></i> Bếp Việt
            </a>
            <div class="flex items-center gap-4">
                <a href="items.html" aria-label="Chuyển đến trang tìm kiếm món ăn" class="inline-flex shrink-0 items-center gap-2 whitespace-nowrap rounded-full bg-orange-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:ring-offset-2">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <span>Tìm món</span>
                </a>
                <div class="relative hidden md:block">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm món ăn..." class="pl-10 pr-4 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 w-64">
                    <i class="fa-solid fa-search absolute left-3.5 top-3 text-gray-400"></i>
                </div>
                <a href="cart.html" class="relative bg-orange-100 text-orange-600 p-2.5 rounded-full hover:bg-orange-200 transition">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-orange-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="bg-gradient-to-r from-orange-500 to-amber-600 text-white py-12 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl md:text-4xl font-extrabold mb-3">Thực Đơn Đêm Ấm Cúng & Ngon Miệng</h1>
            <p class="text-orange-100 text-sm md:text-base">Giao hàng nhanh chóng tận nơi, hương vị đậm đà chuẩn vị nhà làm.</p>
        </div>
    </section>

    <!-- Thêm món ăn -->
    <section class="max-w-7xl mx-auto px-4 pt-8">
        <details open class="rounded-2xl border border-orange-100 bg-white p-5 shadow-sm">
            <summary class="cursor-pointer font-bold text-gray-900">
                <i class="fa-solid fa-plus mr-2 text-orange-500"></i>Thêm món ăn
            </summary>
            <form id="createDishForm" class="mt-5 grid gap-4 md:grid-cols-2">
                <div>
                    <label for="newDishName" class="mb-1 block text-sm font-semibold text-gray-700">Tên món *</label>
                    <input id="newDishName" name="name" type="text" required maxlength="255" class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" placeholder="Ví dụ: Cơm rang dưa bò">
                </div>
                <div>
                    <label for="newDishCategory" class="mb-1 block text-sm font-semibold text-gray-700">Danh mục *</label>
                    <select id="newDishCategory" name="category_id" required class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                        <option value="">Đang tải danh mục...</option>
                    </select>
                </div>
                <div>
                    <label for="newDishPrice" class="mb-1 block text-sm font-semibold text-gray-700">Giá (VNĐ) *</label>
                    <input id="newDishPrice" name="price" type="number" required min="0" step="1000" class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" placeholder="45000">
                </div>
                <div>
                    <label for="newDishImageUrl" class="mb-1 block text-sm font-semibold text-gray-700">URL ảnh</label>
                    <input id="newDishImageUrl" name="image_url" type="url" maxlength="500" class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" placeholder="https://example.com/mon-an.jpg">
                </div>
                <div class="md:col-span-2">
                    <label for="newDishDescription" class="mb-1 block text-sm font-semibold text-gray-700">Mô tả</label>
                    <textarea id="newDishDescription" name="description" rows="2" class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" placeholder="Mô tả ngắn về món ăn"></textarea>
                </div>
                <div class="md:col-span-2 flex flex-wrap items-center gap-4">
                    <button id="createDishButton" type="submit" class="rounded-lg bg-orange-600 px-5 py-2 font-semibold text-white transition hover:bg-orange-700 disabled:cursor-not-allowed disabled:opacity-60">
                        Thêm món
                    </button>
                    <p id="createDishStatus" class="text-sm" role="status" aria-live="polite"></p>
                </div>
            </form>
        </details>
    </section>

    <!-- Món nổi bật (Featured Dishes) -->
    <section class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-xl md:text-2xl font-bold mb-6 flex items-center gap-2 text-gray-900">
            <i class="fa-solid fa-fire text-orange-500"></i> Món Nổi Bật Được Yêu Thích
        </h2>
        <div id="featuredDishesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            <!-- Render bằng JavaScript -->
        </div>
    </section>

    <!-- Thanh danh mục dính trên cùng (Sticky Category Navigation) -->
    <nav id="categoryNav" class="bg-white shadow sticky top-[61px] z-40 border-b overflow-x-auto whitespace-nowrap scrollbar-none">
        <div class="max-w-7xl mx-auto px-4 flex gap-6 py-3" id="categoryNavLinks">
            <!-- Render danh mục bằng JavaScript -->
        </div>
    </nav>

    <!-- Danh sách món ăn theo danh mục -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-12" id="menuSectionsContainer">
        <!-- Render danh sách món theo từng mục bằng JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-6 mt-16 text-sm">
        <p>&copy; 2026 Bếp Việt - Đồ ăn đêm chất lượng cao.</p>
    </footer>

    <!-- JavaScript xử lý gọi API và giao diện -->
    <script>
        const API_BASE = "http://127.0.0.1:8000/api";
        const newDishCategorySelect = document.getElementById('newDishCategory');
        const createDishButton = document.getElementById('createDishButton');
        const createDishStatus = document.getElementById('createDishStatus');
        let activeDishCategoriesAvailable = false;

        async function fetchMenuOverview() {
            try {
                const response = await fetch(`${API_BASE}/menu/overview`);
                if (!response.ok) {
                    throw new Error(`Backend trả về lỗi HTTP ${response.status}`);
                }
                const data = await response.json();
                renderMenu(data.categories || []);
            } catch (error) {
                console.error("Lỗi khi tải thực đơn:", error);
                const errorMessage = error instanceof TypeError
                    ? 'Không kết nối được backend tại http://127.0.0.1:8000. Hãy chạy uvicorn app.main:app --reload trong thư mục backend và kiểm tra MySQL.'
                    : `Không thể tải thực đơn: ${error.message}`;
                const errorElement = document.createElement('p');
                errorElement.className = 'rounded-xl border bg-white p-6 text-center text-red-600';
                errorElement.textContent = errorMessage;
                document.getElementById('menuSectionsContainer').replaceChildren(errorElement);
            }
        }

        async function loadDishCategories() {
            try {
                const response = await fetch(`${API_BASE}/categories`);
                if (!response.ok) {
                    throw new Error(`Backend trả về lỗi HTTP ${response.status}`);
                }

                const categories = (await response.json()).filter((category) => category.is_active);
                newDishCategorySelect.replaceChildren(new Option('Chọn danh mục', ''));
                categories.forEach((category) => {
                    newDishCategorySelect.add(new Option(category.name, String(category.id)));
                });
                activeDishCategoriesAvailable = categories.length > 0;
                newDishCategorySelect.disabled = !activeDishCategoriesAvailable;
                createDishButton.disabled = !activeDishCategoriesAvailable;
                if (categories.length === 0) {
                    setCreateDishStatus('Chưa có danh mục hoạt động. Hãy tạo danh mục trước khi thêm món.', true);
                }
            } catch (error) {
                console.error('Không tải được danh mục món ăn:', error);
                newDishCategorySelect.replaceChildren(new Option('Không tải được danh mục', ''));
                newDishCategorySelect.disabled = true;
                createDishButton.disabled = true;
                setCreateDishStatus(
                    error instanceof TypeError
                        ? 'Không kết nối được backend. Hãy chạy uvicorn app.main:app --reload trong thư mục backend và kiểm tra MySQL.'
                        : error.message,
                    true,
                );
                if (response.ok) {
                    const data = await response.json();
                    renderMenu(data.categories || []);
                    return;
                }
            } catch (error) {
                // Tiếp tục thử fallback bên dưới
            }

            try {
                const [catsRes, dishesRes] = await Promise.all([
                    fetch(`${API_BASE}/categories`),
                    fetch(`${API_BASE}/dishes`)
                ]);
                if (catsRes.ok && dishesRes.ok) {
                    const categories = await catsRes.json();
                    const dishes = await dishesRes.json();
                    const catMap = categories.map(cat => ({
                        ...cat,
                        dishes: dishes.filter(d => d.category_id === cat.id)
                    }));
                    renderMenu(catMap);
                }
            } catch (err) {
                console.error("Lỗi khi tải thực đơn:", err);
            }
        }

        function setCreateDishStatus(message, isError = false) {
            createDishStatus.textContent = message;
            createDishStatus.className = `text-sm ${isError ? 'text-red-600' : 'text-green-700'}`;
        }

        function getApiErrorMessage(data, status) {
            if (typeof data.detail === 'string') return data.detail;
            if (Array.isArray(data.detail)) {
                return data.detail.map((item) => `${item.loc[item.loc.length - 1]}: ${item.msg}`).join('; ');
            }
            return `Backend trả về lỗi HTTP ${status}`;
        }

        document.getElementById('createDishForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            if (!form.reportValidity()) return;

            const imageUrl = document.getElementById('newDishImageUrl').value.trim();
            if (imageUrl) {
                let parsedImageUrl;
                try {
                    parsedImageUrl = new URL(imageUrl);
                } catch {
                    setCreateDishStatus('Vui lòng nhập URL ảnh hợp lệ.', true);
                    return;
                }
                if (!['http:', 'https:'].includes(parsedImageUrl.protocol)) {
                    setCreateDishStatus('URL ảnh chỉ được dùng giao thức HTTP hoặc HTTPS.', true);
                    return;
                }
            }

            createDishButton.disabled = true;
            setCreateDishStatus('Đang thêm món ăn...');
            try {
                const response = await fetch(`${API_BASE}/dishes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        category_id: Number(newDishCategorySelect.value),
                        name: document.getElementById('newDishName').value.trim(),
                        description: document.getElementById('newDishDescription').value.trim() || null,
                        price: Number(document.getElementById('newDishPrice').value),
                        image_url: imageUrl || null,
                        is_available: true,
                        is_active: true,
                        status: 'AVAILABLE',
                    }),
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(getApiErrorMessage(data, response.status));
                }

                form.reset();
                setCreateDishStatus(`Đã thêm món "${data.name}".`);
                await fetchMenuOverview();
            } catch (error) {
                console.error('Không thêm được món ăn:', error);
                setCreateDishStatus(
                    error instanceof TypeError
                        ? 'Không kết nối được backend. Hãy chạy uvicorn app.main:app --reload trong thư mục backend và kiểm tra MySQL.'
                        : error.message,
                    true,
                );
            } finally {
                createDishButton.disabled = !activeDishCategoriesAvailable;
            }
        });

        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(price);
        }

        function renderMenu(categories) {
            const navLinks = document.getElementById('categoryNavLinks');
            const mainContainer = document.getElementById('menuSectionsContainer');
            const featuredContainer = document.getElementById('featuredDishesContainer');

            navLinks.innerHTML = '';
            mainContainer.innerHTML = '';
            featuredContainer.innerHTML = '';

            let allDishes = [];

            categories.forEach((cat, index) => {
                // 1. Render thanh danh mục dính
                const link = document.createElement('a');
                link.href = `#cat-${cat.id}`;
                link.className = `text-sm font-semibold px-4 py-2 rounded-full transition ${index === 0 ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
                link.textContent = cat.name;
                link.onclick = (e) => {
                    e.preventDefault();
                    document.getElementById(`cat-${cat.id}`).scrollIntoView({ behavior: 'smooth' });
                    // Đổi active tab
                    document.querySelectorAll('#categoryNavLinks a').forEach(el => el.classList.replace('bg-orange-500', 'bg-gray-100'));
                    document.querySelectorAll('#categoryNavLinks a').forEach(el => el.classList.replace('text-white', 'text-gray-600'));
                    link.classList.replace('bg-gray-100', 'bg-orange-500');
                    link.classList.replace('text-gray-600', 'text-white');
                };
                navLinks.appendChild(link);

                // Gom món để lọc món nổi bật
                if (cat.dishes) {
                    allDishes.push(...cat.dishes);
                }

                // 2. Render từng section danh mục món ăn
                const section = document.createElement('div');
                section.id = `cat-${cat.id}`;
                section.className = 'scroll-mt-28';
                
                let dishesHTML = '';
                if (cat.dishes && cat.dishes.length > 0) {
                    dishesHTML = cat.dishes.map(dish => {
                        const isSoldOut = !dish.is_available;
                        const opacityClass = isSoldOut ? 'opacity-50 pointer-events-none' : '';
                        const badgeHTML = isSoldOut ? '<span class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-1 rounded font-bold">Hết hàng</span>' : '';
                        const imageUrl = dish.image_url || 'https://via.placeholder.com/300x200?text=Bếp+Việt';

                        return `
                            <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col justify-between relative ${opacityClass}">
                                ${badgeHTML}
                                <div>
                                    <img src="${imageUrl}" alt="${dish.name}" class="w-full h-40 object-cover">
                                    <div class="p-4">
                                        <h3 class="font-bold text-base text-gray-800 line-clamp-1">${dish.name}</h3>
                                        <p class="text-xs text-gray-500 mt-1 line-clamp-2">${dish.description || 'Chưa có mô tả'}</p>
                                        <a href="dish-detail.html?id=${dish.id}" class="inline-flex items-center gap-1 text-xs text-orange-600 hover:text-orange-700 font-semibold mt-2">
                                            <i class="fa-solid fa-star text-amber-500"></i> Xem đánh giá & chi tiết
                                        </a>
                                    </div>
                                </div>
                                <div class="p-4 pt-0 flex items-center justify-between mt-2">
                                    <span class="font-bold text-orange-600 text-base">${formatPrice(dish.price)}</span>
                                    <button onclick="addToCart(${dish.id})" class="bg-orange-600 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-orange-700 transition shadow">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    dishesHTML = `<p class="text-gray-400 italic text-sm">Chưa có món ăn trong danh mục này.</p>`;
                }

                section.innerHTML = `
                    <h2 class="text-2xl font-bold mb-4 text-gray-900 border-l-4 border-orange-500 pl-3">${cat.name}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        ${dishesHTML}
                    </div>
                `;
                mainContainer.appendChild(section);
            });

            // 3. Render món nổi bật (lấy 4 món đầu tiên còn bán)
            const featured = allDishes.filter(d => d.is_available).slice(0, 4);
            featuredContainer.innerHTML = featured.map(dish => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden border border-gray-100 flex flex-col justify-between">
                    <div>
                        <img src="${dish.image_url || 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVycejT6fJNmFKlwbFC4y2VS3uSN-qGwDy8V9ytgblKQ&s=10'}" alt="${dish.name}" class="w-full h-36 object-cover">
                        <div class="p-3">
                            <h3 class="font-bold text-sm text-gray-800 line-clamp-1">${dish.name}</h3>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-1">${dish.description || ''}</p>
                            <a href="dish-detail.html?id=${dish.id}" class="inline-flex items-center gap-1 text-xs text-orange-600 hover:text-orange-700 font-semibold mt-1">
                                <i class="fa-solid fa-star text-amber-500 text-[10px]"></i> Đánh giá
                            </a>
                        </div>
                    </div>
                    <div class="p-3 pt-0 flex items-center justify-between">
                        <span class="font-bold text-orange-600 text-sm">${formatPrice(dish.price)}</span>
                        <button onclick="addToCart(${dish.id})" class="bg-orange-600 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-orange-700 transition">
                            <i class="fa-solid fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(dishId) {
            alert(`Đã thêm món có ID: ${dishId} vào giỏ hàng!`);
            // Logic gọi API thêm giỏ hàng /api/carts/items ở đây
        }

        // Khởi chạy khi tải trang
        document.addEventListener("DOMContentLoaded", fetchMenuOverview);
        document.addEventListener("DOMContentLoaded", loadDishCategories);
    </script>
</body>
</html>
